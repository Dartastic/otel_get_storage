name: otel_get_storage
description: >-
  OpenTelemetry instrumentation for package:get_storage. Wraps read,
  write, remove, and erase calls in CLIENT-kind spans following the
  OTel DB semantic conventions (db.system=get_storage,
  db.collection.name=<container>, db.operation=<op>).
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_get_storage
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  flutter:
    sdk: flutter
  get_storage: ^2.1.1

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
